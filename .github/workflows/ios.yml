name: iOS build, tests and screenshots

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Run unit tests
        run: |
          set -o pipefail
          DEVICE_ID="$(./scripts/pick-simulator.sh)"
          xcodebuild test \
            -project SnoreLog.xcodeproj -scheme SnoreLog \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log

      - name: Build and take screenshots
        if: always()
        run: ./scripts/ci-screenshots.sh screenshots

      - name: Upload screenshots and simulator build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            test.log
            build.log
          if-no-files-found: ignore
