name: iOS build, tests and screenshots

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Run unit tests
        run: |
          set -o pipefail
          DEVICE_ID="$(./scripts/pick-simulator.sh)"
          xcodebuild test \
            -project SnoreLog.xcodeproj -scheme SnoreLog \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log

      - name: Build and take screenshots
        if: always()
        run: ./scripts/ci-screenshots.sh screenshots

      - name: Upload screenshots and simulator build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            test.log
            build.log
          if-no-files-found: ignore

      # Also publish screenshots and logs to a "screenshots" branch, so they can be
      # viewed on github.com without downloading artifacts.
      - name: Publish to the screenshots branch
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p screenshots
          cp test.log build.log screenshots/ 2>/dev/null || true
          cd screenshots
          git init -q -b screenshots
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
